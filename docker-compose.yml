version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://loguser:logpass@postgres:5432/logdb
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    command: postgres -c synchronous_commit=off -c max_wal_size=2GB -c shared_buffers=256MB -c work_mem=16MB
    environment:
      POSTGRES_DB: logdb
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpass
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loguser -d logdb"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata: