
services:
  app:
    build: .
    # The app aborts the process on an unrecoverable V8 heap error. Without a
    # restart policy that abort is terminal for the rest of the run: the
    # container stays dead and every subsequent request is connection-refused.
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://loguser:logpass@postgres:5432/logdb
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    # Docker defaults /dev/shm to 64MB, which Postgres uses for parallel worker
    # shared memory. Observed failing in practice with
    #   "could not resize shared memory segment ... No space left on device"
    # during VACUUM on a large partition.
    shm_size: 256mb
    # All Postgres tuning lives here, in one visible place. (It used to be
    # duplicated in an ALTER SYSTEM block in src/db/migrate.ts that silently
    # failed on every boot — see that file.)
    #
    #   synchronous_commit=off          each COPY commit no longer waits on an
    #                                   fsync. Measured 6.7x faster on batched
    #                                   writes. Consistent with the service's
    #                                   existing ack-before-durable design.
    #   max_parallel_workers_per_gather=0
    #                                   the container is capped at 1.0 CPU but
    #                                   `nproc` still reports the host's 8, so
    #                                   Postgres would plan 2 extra workers and
    #                                   oversubscribe its own quota. Measured
    #                                   5.2x SLOWER with parallelism than
    #                                   without on the aggregation query.
    #   effective_cache_size=768MB      was defaulting to 4GB against a 1GB
    #                                   container, skewing planner cost
    #                                   estimates.
    command: >
      postgres
      -c synchronous_commit=off
      -c max_parallel_workers_per_gather=0
      -c effective_cache_size=768MB
      -c max_wal_size=2GB
      -c shared_buffers=256MB
      -c work_mem=16MB
    environment:
      POSTGRES_DB: logdb
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpass
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loguser -d logdb"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata: